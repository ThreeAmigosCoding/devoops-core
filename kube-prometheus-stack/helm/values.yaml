fullnameOverride: devoops-monitoring

alertmanager:
  enabled: false

kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

kubelet:
  enabled: true
  serviceMonitor:
    insecureSkipVerify: true
    cAdvisorMetricRelabelings:
      - sourceLabels: [image]
        regex: '^$'
        replacement: 'missing'
        targetLabel: image
        action: replace
      - sourceLabels: [container]
        regex: '^$'
        replacement: 'missing'
        targetLabel: container
        action: replace

prometheusOperator:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

prometheus:
  prometheusSpec:
    retention: 30d
    scrapeInterval: "15s"
    evaluationInterval: "15s"
    externalLabels:
      monitor: "devoops-monitor"
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

grafana:
  adminUser: devoops
  adminPassword: devoops
  service:
    type: ClusterIP
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

  defaultDashboardsEnabled: true

  sidecar:
    datasources:
      defaultDatasourceEnabled: false

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://devoops-monitoring-prometheus:9090
          access: proxy
          isDefault: true
          editable: false

prometheus-node-exporter:
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 50m

kube-state-metrics:
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 50m
