apiVersion: v1
kind: Service
metadata:
  name: {{ include "devoops-service.fullname" . }}
  labels:
    {{ include "devoops-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    {{- if .Values.service.grpc.enabled }}
    - name: grpc
      port: {{ .Values.service.grpc.port }}
      targetPort: grpc
      protocol: TCP
    {{- end }}
  selector:
    {{ include "devoops-service.selectorLabels" . | nindent 4 }}
