clusterName: devoops-elasticsearch
masterService: devoops-elasticsearch

replicas: 1
minimumMasterNodes: 1

imageTag: "8.11.0"

protocol: http

esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.security.transport.ssl.enabled: false

esJavaOpts: "-Xms512m -Xmx512m"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi

service:
  type: ClusterIP

antiAffinity: "soft"

createCert: false
