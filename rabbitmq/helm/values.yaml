global:
  security:
    allowInsecureImages: true

auth:
  username: devoops
  password: devoops123
  erlangCookie: secretcookie

image:
  registry: docker.io
  repository: bitnamilegacy/rabbitmq
  tag: 4.1.3

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

persistence:
  enabled: true
  size: 1Gi

plugins: "rabbitmq_management rabbitmq_peer_discovery_k8s"

service:
  type: ClusterIP
  ports:
    amqp: 5672
    manager: 15672